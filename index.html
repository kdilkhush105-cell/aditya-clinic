<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawai Billing</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#1e3a8a;
      margin-bottom:10px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#444;
    }

    .info{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:20px;
    }

    input{
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      width:100%;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    table th,
    table td{
      border:1px solid #ccc;
      padding:10px;
      text-align:center;
    }

    table th{
      background:#2563eb;
      color:white;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:5px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      margin-top:15px;
      margin-right:10px;
      font-size:15px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .total{
      margin-top:20px;
      font-size:22px;
      font-weight:bold;
      text-align:right;
      color:#111827;
    }

    footer{
      text-align:center;
      margin-top:30px;
      color:#666;
    }

    @media(max-width:600px){
      .info{
        grid-template-columns:1fr;
      }

      table{
        font-size:12px;
      }

      button{
        width:100%;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>आदित्य क्लिनिक एंड डायग्नोस्टिक सेंटर</h1>
  <h2>Medicine Billing System</h2>

  <div class="info">
    <input type="text" placeholder="Patient Name">
    <input type="date">
    <input type="text" placeholder="Doctor Name">
    <input type="text" placeholder="Mobile Number">
  </div>

  <table id="medicineTable">
    <thead>
      <tr>
        <th>Medicine Name</th>
        <th>Quantity</th>
        <th>Price ₹</th>
        <th>Total ₹</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td><input type="text" placeholder="Medicine Name"></td>
        <td><input type="number" value="1" class="qty"></td>
        <td><input type="number" value="0" class="price"></td>
        <td class="rowTotal">0</td>
      </tr>
    </tbody>
  </table>

  <button onclick="addRow()">Add Medicine</button>
  <button onclick="calculateBill()">Calculate Total</button>
  <button onclick="window.print()">Print Bill</button>

  <div class="total">
    Grand Total ₹ <span id="grandTotal">0</span>
  </div>

  <footer>
    © 2026 Aditya Clinic Billing Software
  </footer>

</div>

<script>

function addRow(){

  let table = document.querySelector('#medicineTable tbody');

  let row = document.createElement('tr');

  row.innerHTML = `
    <td><input type="text" placeholder="Medicine Name"></td>
    <td><input type="number" value="1" class="qty"></td>
    <td><input type="number" value="0" class="price"></td>
    <td class="rowTotal">0</td>
  `;

  table.appendChild(row);
}

function calculateBill(){

  let qty = document.querySelectorAll('.qty');
  let price = document.querySelectorAll('.price');
  let rowTotal = document.querySelectorAll('.rowTotal');

  let grandTotal = 0;

  for(let i=0; i<qty.length; i++){

    let total = qty[i].value * price[i].value;

    rowTotal[i].innerText = total;

    grandTotal += total;
  }

  document.getElementById('grandTotal').innerText = grandTotal;
}

</script>

</body>

</body>
</html>
